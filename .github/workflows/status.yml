name: Daily status

# One comment a day on the "Oracle hunt status" issue: proof the loop is alive
# even when every attempt finds no capacity. Silence means something broke.

on:
  schedule:
    - cron: "0 1 * * *" # 08:00 Asia/Saigon
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: oracle-a1-status
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Collect the last runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run list --workflow hunt.yml --limit 200 --json createdAt,conclusion,event,url > runs.json

      - name: Build the report
        run: python status.py runs.json > report.md

      - name: Post it
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh issue list --state open --search 'in:title "Oracle hunt status"' --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body-file report.md
          else
            gh issue create --title "Oracle hunt status" --body-file report.md
          fi
